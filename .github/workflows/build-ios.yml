name: Build iPhone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stride-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iPhone app
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: '1'

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies and check types
        run: |
          npm ci
          npm run typecheck
      - name: Generate the iOS project
        run: |
          xcodebuild -version
          node <<'JS'
          const fs = require('node:fs');
          const config = require('./app.json');
          config.expo.ios.buildNumber = process.env.GITHUB_RUN_NUMBER + '.' + process.env.GITHUB_RUN_ATTEMPT;
          fs.writeFileSync('app.json', JSON.stringify(config, null, 2) + '\n');
          JS
          npx --no-install expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Compile for physical iPhones
        run: |
          xcodebuild \
            -workspace ios/STRIDE.xcworkspace \
            -scheme STRIDE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/stride-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Validate and package the IPA
        run: |
          app="$RUNNER_TEMP/stride-build/Build/Products/Release-iphoneos/STRIDE.app"
          test -s "$app/main.jsbundle"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], 'rb') as file:
              info = plistlib.load(file)
          assert 'iPhoneOS' in info['CFBundleSupportedPlatforms'], 'Expected a device build'
          minimum = tuple(map(int, info['MinimumOSVersion'].split('.')))
          assert minimum <= (18, 7, 10), 'Build requires a newer iOS version than the target iPhone'
          print("Minimum iOS version:", info['MinimumOSVersion'])
          PY
          lipo "$app/STRIDE" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/stride-package/Payload"
          ditto "$app" "$RUNNER_TEMP/stride-package/Payload/STRIDE.app"
          mkdir -p "$RUNNER_TEMP/stride-release"
          ipa="$RUNNER_TEMP/stride-release/STRIDE-unsigned.ipa"
          ditto -c -k --keepParent "$RUNNER_TEMP/stride-package/Payload" "$ipa"
          unzip -tq "$ipa"
          python3 scripts/make-altstore-source.py "$ipa" "$RUNNER_TEMP/stride-release/altstore-source.json"
      - name: Upload STRIDE IPA
        uses: actions/upload-artifact@v7
        with:
          name: STRIDE-unsigned
          path: ${{ runner.temp }}/stride-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    name: Publish the AltStore update
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: STRIDE-unsigned
          path: stride-release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_commit" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Skipping publication."
            exit 0
          fi

          build="$(jq -er '.apps[0].versions[0].buildVersion' stride-release/altstore-source.json)"
          [[ "$build" =~ ^[0-9]+\.[0-9]+$ ]]
          tag="stride-ios-$build"
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" == 'true' ]]; then
              gh release upload "$tag" stride-release/STRIDE-unsigned.ipa stride-release/altstore-source.json \
                --repo "$GITHUB_REPOSITORY" --clobber
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            fi
            exit 0
          fi
          gh release create "$tag" \
            stride-release/STRIDE-unsigned.ipa stride-release/altstore-source.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "STRIDE iOS build $build" \
            --notes "Unsigned iPhone build for AltStore Classic."
